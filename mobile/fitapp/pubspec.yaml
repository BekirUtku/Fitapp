name: fitapp
description: Local-first spor takip uygulaması.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # Local storage (source of truth)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Notifications (rest timer)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Connectivity (sync tetikleme: bağlantı geldiğinde)
  connectivity_plus: ^6.0.5

  # Charts
  fl_chart: ^0.69.0

  # Dosya dışa aktarma (bytes indir + paylaş)
  path_provider: ^2.1.4
  share_plus: ^10.1.2

  # Utils
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
