name: fitapp
description: Local-first spor takip uygulaması.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.7.0

  # Local storage (source of truth)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Notifications (rest timer)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Connectivity (sync tetikleme: bağlantı geldiğinde)
  connectivity_plus: ^6.0.5

  # Charts
  fl_chart: ^0.69.0

  # Files & export
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  excel: ^4.0.6
  csv: ^6.0.0
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
